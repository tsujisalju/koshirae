services:
  frontend:
    build:
      context: ./reference-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./reference-frontend:/app
      - /app/node_modules
      - frontend_npm_cache:/root/.npm
    environment:
      - NEXT_PUBLIC_AGENT_SERVICE_URL=http://localhost:8000
    env_file:
      - ./reference-frontend/.env
    depends_on:
      - agent-service

  agent-service:
    build:
      context: ./reference-agent
    ports:
      - "8000:8000"
    volumes:
      - ./reference-agent:/app
    environment:
      - ORONYX_EXECUTOR_URL=http://executor:4000
    env_file:
      - ./reference-agent/.env
    depends_on:
      - executor

  executor:
    build:
      context: ./reference-executor
    ports:
      - "4000:4000"
    volumes:
      - ./reference-executor:/app
      - /app/node_modules
      - executor_npm_cache:/root/.npm
    env_file:
      - ./reference-executor/.env

volumes:
  frontend_npm_cache:
  executor_npm_cache:
